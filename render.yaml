services:
  - type: web
    name: trading-bot
    runtime: python
    plan: free
    buildCommand: pip install -r dashboard_requirements.txt
    startCommand: gunicorn dashboard:app --timeout 120 --log-file -
    envVars:
      - key: ALPACA_KEY
        sync: false
      - key: ALPACA_SECRET
        sync: false
      - key: TELEGRAM_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: RISK_LEVEL
        value: medium
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: TRIGGER_SECRET
        sync: false
